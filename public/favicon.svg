  <rect x="4" y="16" width="4" height="4" fill="#3f2b1a" />
  <rect x="12" y="20" width="4" height="4" fill="#6f5033" />
  <rect x="24" y="16" width="4" height="4" fill="#3f2b1a" />
  <rect x="20" y="24" width="4" height="4" fill="#6f5033" />
